# Daily: collect rdwlabz.json from RDW-Labz repos and open a PR if the project list changed.
# Never pushes to main and never deploys. Two secrets, each with the least access it needs:
# - RDWLABZ_SYNC_TOKEN: read-only (Contents) across RDW-Labz repos, used only to read rdwlabz.json.
# - RDWLABZ_PR_TOKEN: rdwlabz-site only (Contents + Pull requests write), used only to push the
#   bot branch and open the PR (the enterprise policy blocks GITHUB_TOKEN from creating PRs).
name: Sync projects

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# The built-in token only needs to read this repo; all writes go through RDWLABZ_PR_TOKEN.
permissions:
  contents: read

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: bot/sync-projects
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect rdwlabz.json files
        env:
          RDWLABZ_SYNC_TOKEN: ${{ secrets.RDWLABZ_SYNC_TOKEN }}
        run: |
          node scripts/sync-projects.mjs --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: diff
        run: |
          npx prettier --write src/data/projects.json
          if git diff --quiet -- src/data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build must pass before a PR is opened
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Open or update the sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_TOKEN: ${{ secrets.RDWLABZ_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.RDWLABZ_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_TOKEN" ]; then
            echo "::error::RDWLABZ_PR_TOKEN is not set (see README: Auto project tracker)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/data/projects.json
          git commit -m "Sync projects from rdwlabz.json files"
          git push --force "https://x-access-token:${PR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync projects from rdwlabz.json" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/summary.md"
          fi
