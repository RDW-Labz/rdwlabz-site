# Daily: collect rdwlabz.json from RDW-Labz repos and open a PR if the project list changed.
# Never pushes to main and never deploys. Needs the RDWLABZ_SYNC_TOKEN secret (read-only PAT).
name: Sync projects

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: bot/sync-projects
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect rdwlabz.json files
        env:
          RDWLABZ_SYNC_TOKEN: ${{ secrets.RDWLABZ_SYNC_TOKEN }}
        run: |
          node scripts/sync-projects.mjs --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: diff
        run: |
          npx prettier --write src/data/projects.json
          if git diff --quiet -- src/data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build must pass before a PR is opened
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Open or update the sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/data/projects.json
          git commit -m "Sync projects from rdwlabz.json files"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync projects from rdwlabz.json" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/summary.md"
          fi
